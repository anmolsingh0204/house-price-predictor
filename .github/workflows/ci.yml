name: Continuous Integration

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  PYTHON_VERSION: '3.11'
  POETRY_VERSION: '1.7.0'

jobs:
  # Code quality checks
  lint:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install black flake8 mypy

      - name: Check formatting with Black
        run: black --check --diff src/

      - name: Lint with flake8
        run: flake8 src/ --max-line-length=100 --ignore=E203,W503

      - name: Type check with mypy
        run: mypy src/ --ignore-missing-imports || true

  # Unit tests
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-mock pytest-asyncio

      - name: Generate test dataset
        run: python src/data/generate_dataset.py

      - name: Train model (quick)
        run: |
          cd src/ml
          python -c "
import sys
sys.path.insert(0, '.')
from train_model import *
import pandas as pd
df = generate_dataset(1000)
df.to_csv('../../data/train_data.csv', index=False)
df.to_csv('../../data/test_data.csv', index=False)
print('Quick train data generated')
"

      - name: Run tests with coverage
        run: |
          pytest src/tests/ -v \
            --cov=src \
            --cov-report=xml \
            --cov-report=term-missing \
            --cov-fail-under=70

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage.xml
          flags: unittests
          name: codecov-umbrella

  # Model training validation
  ml-validation:
    name: ML Model Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate full dataset
        run: python src/data/generate_dataset.py

      - name: Train model
        run: python src/ml/train_model.py

      - name: Validate model metrics
        run: |
          python -c "
import json
with open('models/model_metrics.json') as f:
    metrics = json.load(f)
test_r2 = metrics['test_metrics']['r2']
test_rmse = metrics['test_metrics']['rmse']
print(f'Test R²: {test_r2:.4f}')
print(f'Test RMSE: {test_rmse:.2f}')
assert test_r2 > 0.85, f'R² too low: {test_r2}'
assert test_rmse < 100000, f'RMSE too high: {test_rmse}'
print('Model validation passed!')
"

      - name: Upload model artifacts
        uses: actions/upload-artifact@v4
        with:
          name: trained-model
          path: |
            models/house_price_model.pkl
            models/preprocessor.pkl
            models/model_metrics.json
            models/feature_importance.json
          retention-days: 7

  # Docker build test
  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: house-price-predictor:test
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test Docker image
        run: |
          docker run --rm house-price-predictor:test python -c "
import joblib
model = joblib.load('models/house_price_model.pkl')
print('Model loaded successfully in Docker')
"

  # Security scan
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v2
        with:
          sarif_file: 'trivy-results.sarif'

  # Dependency check
  dependencies:
    name: Dependency Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Audit dependencies
        run: pip-audit -r requirements.txt --format=json --output=audit.json || true

      - name: Upload audit results
        uses: actions/upload-artifact@v4
        with:
          name: dependency-audit
          path: audit.json
          retention-days: 7